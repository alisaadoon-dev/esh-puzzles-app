name: Build game

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Unpack game.zip
        run: |
          if [ -f game.zip ]; then unzip -o -q game.zip -d . ; fi
          ls lib

      - name: Copy character pictures from the repo root
        run: |
          mkdir -p assets/images
          for n in owl owl_happy owl_sad fox fox_happy fox_sad crow hedgehog egg; do
            for ext in png jpg jpeg webp; do
              if [ -f "$n.$ext" ]; then cp "$n.$ext" assets/images/; fi
            done
          done
          ls assets/images

      - name: Generate voice lines (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        timeout-minutes: 60
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "No GEMINI_API_KEY secret - building without voices"
            exit 0
          fi
          python3 tools/make_voices.py || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/voice
          if ! git diff --cached --quiet; then
            git commit -m "Add voice lines [skip ci]"
            git push || true
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.eshpuzzles --project-name esh_puzzles .
          fi

      - name: App name, icon and Xiaomi fix
        run: |
          if [ -d android_res ]; then cp -r android_res/* android/app/src/main/res/; fi
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="@string\/app_name"/' $M
          grep -q 'permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          F=$(ls android/app/build.gradle* | head -1)
          echo 'android { packaging { jniLibs { useLegacyPackaging = true } } }' >> $F
          # مكتبة الإشعارات تحتاج desugaring
          if [[ "$F" == *.kts ]]; then
            echo 'android { compileOptions { isCoreLibraryDesugaringEnabled = true } }' >> $F
            echo 'dependencies { add("coreLibraryDesugaring", "com.android.tools:desugar_jdk_libs:2.1.4") }' >> $F
          else
            echo 'android { compileOptions { coreLibraryDesugaringEnabled true } }' >> $F
            echo 'dependencies { coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4" }' >> $F
          fi
          # أذونات ومستقبلات التذكير اليومي
          python3 - "$M" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          perms = ['android.permission.POST_NOTIFICATIONS', 'android.permission.RECEIVE_BOOT_COMPLETED']
          for perm in perms:
              if perm not in s:
                  s = s.replace('<application', '<uses-permission android:name="%s"/>\n    <application' % perm, 1)
          rec = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          '''
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>', rec + '    </application>', 1)
          open(p, 'w').write(s)
          PY
          tail -5 $F
          grep -n "permission\|receiver" $M

      - name: Fixed signing key
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -n "$KEY_PASS" ] && [ -f signing/esh.p12 ]; then
            mkdir -p ~/.android
            rm -f ~/.android/debug.keystore
            keytool -importkeystore -noprompt \
              -srckeystore signing/esh.p12 -srcstoretype PKCS12 -srcstorepass "$KEY_PASS" -srcalias esh \
              -destkeystore ~/.android/debug.keystore -deststoretype JKS \
              -deststorepass android -destkeypass android -destalias androiddebugkey
            echo "Signed with the fixed key"
          else
            echo "No KEY_PASS secret - using a temporary key"
          fi

      - run: flutter pub get

      # رقم النسخة يزيد مع كل بناء، حتى تثبت التحديثات فوق القديمة ويقبلها Play Store
      - run: flutter build apk --release --build-number=$((1000 + ${{ github.run_number }}))

      # ملف AAB: هو الذي يُرفع إلى Google Play
      - run: flutter build appbundle --release --build-number=$((1000 + ${{ github.run_number }}))
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: esh-puzzles-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: esh-puzzles-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Publish APK with a direct link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Version ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
