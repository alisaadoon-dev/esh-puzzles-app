name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --org com.alisaadoon --project-name esh_puzzles --platforms android .

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="عش الألغاز"/' android/app/src/main/AndroidManifest.xml
      - name: Fix install on Xiaomi
        run: |
          F=$(ls android/app/build.gradle* | head -1)
          cat >> $F <<'EOF'

          android {
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          EOF
      - name: Build APK
        run: |
          flutter pub add audioplayers shared_preferences
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Check APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ls -la build/app/outputs/flutter-apk/
          $BT/aapt2 dump badging $APK | grep -E "package:|sdkVersion|targetSdk|native-code|application-label"
          $BT/apksigner verify --verbose --print-certs $APK

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk esh-puzzles.apk
          cp app-armeabi-v7a-release.apk esh-puzzles-old-phones.apk
          gh release delete latest --yes --cleanup-tag || true
          sleep 5
          gh release create latest esh-puzzles.apk esh-puzzles-old-phones.apk --title "أحدث نسخة" --notes "بناء رقم ${{ github.run_number }}"
